# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt

env:
  PULUMI_API: https://api.pulumi-staging.io
  PULUMI_GO_DEP_ROOT: ${{ github.workspace }}/..
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_PULUMI_ENABLE_JOURNALING: "true"
  TF_APPEND_USER_AGENT: pulumi

jobs:
  command-dispatch-for-testing:
    name: command-dispatch-for-testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For ESC secrets.
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false    
    - id: esc-auth
      name: Authenticate with Pulumi Cloud
      uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622
      with:
        export-environment-variables: "false"
        organization: pulumi
        requested-token-type: urn:pulumi:token-type:access_token:organization
    - id: esc-secrets
      name: Fetch secrets from ESC
      uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119
      with:
        environment: imports/github-secrets
        export-environment-variables: "false"
        pulumi-access-token: ${{ steps.esc-auth.outputs.pulumi-access-token }}
    - uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a # v5
      with:
        commands: |
          run-acceptance-tests
          release
        issue-type: pull-request
        permission: write
        reaction-token: ${{ secrets.GITHUB_TOKEN }}
        repository: pulumi/pulumi-provider-boilerplate
        token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
name: command-dispatch
on:
  issue_comment:
    types:
    - created
    - edited
